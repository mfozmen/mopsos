name: CI

on:
  pull_request:
  push:
    branches: [main]

# Default to the narrowest possible token. Jobs widen this only when they must.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # A boolean, not the token. `secrets` is not available in an `if` condition,
    # but putting the token itself in job-level env would hand it to every step —
    # including `npm ci`, which runs dependency lifecycle scripts. One malicious
    # package upstream and the token walks out. Only the scan step gets the value.
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarCloud needs blame data to attribute new code.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

      # After the artifact upload on purpose: if this step fails the job stops,
      # and the coverage report is more useful in hand than lost with it.
      #
      # A different problem from secret scanning, which matches credential
      # formats and cannot recognise a first-person amount as sensitive.
      - run: npm run scan:personal-data

      # Same job as the tests, so the freshly written lcov report is already on disk.
      - name: SonarCloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # A skipped scan must be loud. A quality gate that silently does nothing is
      # worse than no quality gate, because the green check still looks like proof.
      - name: SonarCloud not configured
        if: env.HAS_SONAR_TOKEN == 'false'
        run: echo "::warning::SonarCloud scan skipped - SONAR_TOKEN is not set."
