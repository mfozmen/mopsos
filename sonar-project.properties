sonar.organization=mfozmen
sonar.projectKey=mfozmen_mopsos
sonar.projectName=Mopsos

sonar.sources=src
sonar.exclusions=src/**/*.test.ts

sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts

# Written by `npm run test:coverage` in the CI job before the scan runs.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# CLI entry points are excluded from the coverage requirement, not from analysis.
# They read arguments, print, and set an exit code; every decision they make is
# in a function under src/research or src/score, which is covered. Testing them
# would mean spawning a process, whose coverage the v8 provider cannot collect
# anyway — so it would buy a green number rather than an actual check.
#
# This exclusion stays narrow on purpose. The moment a file under src/cli grows
# a branch worth testing, that branch belongs in a module, not here.
sonar.coverage.exclusions=src/cli/**
